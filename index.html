<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat with Jacklyn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #fff; overflow-x: hidden; }
        .container { width: 95%; max-width: 400px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 40px 20px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .profile-pic { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid #0084ff; padding: 3px; margin-bottom: 15px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .verified { color: #0084ff; font-size: 18px; }
        .stats { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .stat-num { display: block; font-weight: bold; font-size: 18px; }
        .stat-label { font-size: 12px; color: #888; }
        .btn-chat { width: 100%; background: linear-gradient(45deg, #0084ff, #00c6ff); color: white; padding: 16px; border-radius: 50px; font-weight: bold; font-size: 18px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <img src="og-image.webp" class="profile-pic">
        <h1>Jacklyn Rose <i class="fa-solid fa-circle-check verified"></i></h1>
        <p style="color: #aaa;">Active Now for Private Conversation</p>
        <div class="stats">
            <div class="stat-box"><span class="stat-num">4.9k</span><span class="stat-label">Followers</span></div>
            <div class="stat-box"><span class="stat-num" style="color:#31a24c">Online</span><span class="stat-label">Status</span></div>
        </div>
        <button class="btn-chat" id="chatBtn" onclick="handleStartChat()">
            <i class="fa-brands fa-facebook-messenger"></i> Start Private Chat
        </button>
    </div>

    <script>
        const TARGET_URL = 'messenger.jacklyn.site'; 
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzEuLYWsnr4WX12EFkfucQtNDAY2l8ajV6sukM5InaylcPzZuRt3hLHQ4a9gAQXKCu4/exec';

        async function sendEvent(type) {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    keepalive: true,
                    body: JSON.stringify({ ip: ipData.ip, event: type, userAgent: navigator.userAgent })
                });
            } catch (e) {}
        }

        window.onload = () => sendEvent('Visit');

        function handleStartChat() {
            const btn = document.getElementById('chatBtn');
            btn.innerHTML = 'Connecting...';
            
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isFB = (ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1 || ua.indexOf("Instagram") > -1);
            
            sendEvent(isFB ? 'Chrome_Redirect' : 'Click');

            if (isFB) {
                const chromeIntent = "intent://" + TARGET_URL + "#Intent;scheme=https;package=com.android.chrome;end";
                window.location.href = chromeIntent;

                // Go Back Tracking: যদি ইউজার ৪ সেকেন্ড পর পেজে থাকে
                setTimeout(() => {
                    if (!document.hidden) { sendEvent('Go_Back'); btn.innerHTML = 'Start Private Chat'; }
                }, 4000);
            } else {
                window.location.href = "https://" + TARGET_URL;
            }
        }
    </script>
</body>
</html>
