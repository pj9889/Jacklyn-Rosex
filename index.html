<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat with Jacklyn</title>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jacklyn-rosex.pages.dev/">
    <meta property="og:title" content="Private Chat with Jacklyn Rose">
    <meta property="og:description" content="Active Now for Private Conversation & Video Calls. Connect securely.">
    <meta property="og:image" content="https://jacklyn-rosex.pages.dev/og-image.webp">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        /* --- FB IN-APP BROWSER REDIRECT --- */
        var ua = navigator.userAgent || navigator.vendor || window.opera;
        if (ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1) {
            window.location.href = "intent://" + window.location.hostname + window.location.pathname + "#Intent;scheme=https;package=com.android.chrome;end";
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #fff; overflow-x: hidden; }
        
        .container { width: 95%; max-width: 400px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 40px 20px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative; z-index: 1; }
        .profile-container { position: relative; width: 140px; height: 140px; margin: 0 auto 20px; }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #0084ff; padding: 3px; }
        .online-dot { position: absolute; bottom: 10px; right: 10px; width: 22px; height: 22px; background: #31a24c; border: 3px solid #1a1a1a; border-radius: 50%; }
        h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .verified { color: #0084ff; font-size: 18px; }
        p { color: #b0b3b8; font-size: 15px; margin-top: 10px; line-height: 1.5; }
        .stats { display: flex; justify-content: center; gap: 20px; margin: 25px 0; }
        .stat-box { text-align: center; }
        .stat-num { display: block; font-weight: bold; font-size: 18px; }
        .stat-label { font-size: 12px; color: #888; }
        .btn-chat { 
            display: block; background: linear-gradient(45deg, #0084ff, #00c6ff); 
            color: white; text-decoration: none; padding: 16px; border-radius: 50px; 
            font-weight: bold; font-size: 18px; transition: 0.3s; 
            box-shadow: 0 10px 20px rgba(0, 132, 255, 0.3); cursor: pointer; border: none; width: 100%;
        }
        .btn-chat:active { transform: scale(0.95); }
        .btn-chat.loading { opacity: 0.7; pointer-events: none; }
        .footer-note { font-size: 11px; color: #555; margin-top: 30px; letter-spacing: 0.5px; text-transform: uppercase; }

        /* --- ADMIN DASHBOARD --- */
        #adminDashboard { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; z-index: 9999; overflow-y: auto; padding: 20px; color: #1c1e21; }
        .dash-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .dash-card h2 { font-size: 32px; color: #0084ff; margin: 5px 0; }
        .dash-card p { font-size: 12px; font-weight: bold; color: #65676b; text-transform: uppercase; }
        .close-dash { background: #ff4747; color: white; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        .refresh-btn { width: 100%; background: #0084ff; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container" id="landingPage">
        <div class="profile-container">
            <img src="og-image.webp" alt="Jacklyn Rose" class="profile-pic">
            <div class="online-dot"></div>
        </div>
        <h1>Jacklyn Rose <i class="fa-solid fa-circle-check verified"></i></h1>
        <p>Active Now for Private Conversation & Video Calls</p>
        <div class="stats">
            <div class="stat-box"><span class="stat-num">4.9k</span><span class="stat-label">Followers</span></div>
            <div class="stat-box"><span class="stat-num">Online</span><span class="stat-label">Status</span></div>
        </div>
        <button class="btn-chat" id="chatBtn" onclick="handleStartChat()">
            <i class="fa-brands fa-facebook-messenger"></i> Start Private Chat
        </button>
        <div class="footer-note">Secure & Encrypted Connection</div>
    </div>

    <div id="adminDashboard">
        <div class="close-dash" onclick="location.hash=''">CLOSE DASHBOARD</div>
        <h2 style="text-align:center; margin-bottom:20px;">Landing Page Analytics</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="dash-card"><h2 id="d-visitor">0</h2><p>Total Visitors</p></div>
            <div class="dash-card"><h2 id="d-click">0</h2><p>Total Clicks</p></div>
        </div>
        <div class="dash-card"><h2 id="d-chrome" style="color: #34a853;">0</h2><p>Chrome Users</p></div>
        <div class="dash-card" style="height: 250px;"><canvas id="landingChart"></canvas></div>
        <button class="refresh-btn" onclick="fetchAnalytics()">Refresh Data</button>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxW8qbe5Gp0foZ6mxL77wi3zF__1ZkXMLBE84yPAgk7vzlpaFIMGKefu76IErMNK-m9/exec';
        const TARGET_URL = 'https://done888.pages.dev'; 

        async function sendData(type) {
            const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor) ? 1 : 0;
            const payload = {
                sheet: "LandingData",
                visitor: type === 'visit' ? 1 : 0,
                click: type === 'click' ? 1 : 0,
                chrome: type === 'visit' ? isChrome : 0
            };
            fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        }

        async function handleStartChat() {
            const btn = document.getElementById('chatBtn');
            btn.innerHTML = 'Connecting...';
            await sendData('click');
            setTimeout(() => { window.location.href = TARGET_URL; }, 500);
        }

        function checkAdmin() {
            if(window.location.hash === "#admin") {
                document.getElementById('adminDashboard').style.display = 'block';
                document.getElementById('landingPage').style.display = 'none';
                fetchAnalytics();
            } else {
                document.getElementById('adminDashboard').style.display = 'none';
                document.getElementById('landingPage').style.display = 'block';
            }
        }

        let chart;
        async function fetchAnalytics() {
            try {
                const res = await fetch(WEB_APP_URL);
                const d = await res.json();
                document.getElementById('d-visitor').innerText = d.visitor;
                document.getElementById('d-click').innerText = d.click;
                document.getElementById('d-chrome').innerText = d.chrome;

                const ctx = document.getElementById('landingChart').getContext('2d');
                if(chart) chart.destroy();
                chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Visitors', 'Clicks', 'Chrome'],
                        datasets: [{ data: [d.visitor, d.click, d.chrome], backgroundColor: ['#0084ff', '#00c6ff', '#34a853'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            } catch(e) { console.error("Error fetching stats"); }
        }

        window.onhashchange = checkAdmin;
        window.onload = () => { sendData('visit'); checkAdmin(); };
    </script>
</body>
</html>
