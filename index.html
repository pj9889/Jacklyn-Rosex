<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat with Jacklyn</title>

    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jacklyn-rosex.pages.dev/">
    <meta property="og:title" content="Private Chat with Jacklyn Rose">
    <meta property="og:description" content="Active Now for Private Conversation & Video Calls. Connect securely.">
    <meta property="og:image" content="https://jacklyn-rosex.pages.dev/og-image.webp">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #fff; }
        .container { width: 90%; max-width: 400px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 40px 20px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .profile-container { position: relative; width: 140px; height: 140px; margin: 0 auto 20px; }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #0084ff; padding: 3px; }
        .online-dot { position: absolute; bottom: 10px; right: 10px; width: 22px; height: 22px; background: #31a24c; border: 3px solid #1a1a1a; border-radius: 50%; }
        h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .verified { color: #0084ff; font-size: 18px; }
        p { color: #b0b3b8; font-size: 15px; margin-top: 10px; line-height: 1.5; }
        .stats { display: flex; justify-content: center; gap: 20px; margin: 25px 0; }
        .stat-box { text-align: center; }
        .stat-num { display: block; font-weight: bold; font-size: 18px; }
        .stat-label { font-size: 12px; color: #888; }
        .btn-chat { 
            display: block; 
            background: linear-gradient(45deg, #0084ff, #00c6ff); 
            color: white; 
            text-decoration: none; 
            padding: 16px; 
            border-radius: 50px; 
            font-weight: bold; 
            font-size: 18px; 
            transition: 0.3s; 
            box-shadow: 0 10px 20px rgba(0, 132, 255, 0.3);
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn-chat:active { transform: scale(0.95); }
        .btn-chat.loading { opacity: 0.7; pointer-events: none; }
        .footer-note { font-size: 11px; color: #555; margin-top: 30px; letter-spacing: 0.5px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-container">
            <img src="og-image.webp" alt="Jacklyn Rose" class="profile-pic">
            <div class="online-dot"></div>
        </div>

        <h1>Jacklyn Rose <i class="fa-solid fa-circle-check verified"></i></h1>
        <p>Active Now for Private Conversation & Video Calls</p>

        <div class="stats">
            <div class="stat-box">
                <span class="stat-num">4.9k</span>
                <span class="stat-label">Followers</span>
            </div>
            <div class="stat-box">
                <span class="stat-num">Online</span>
                <span class="stat-label">Status</span>
            </div>
        </div>

        <button class="btn-chat" id="chatBtn" onclick="handleStartChat()">
            <i class="fa-brands fa-facebook-messenger"></i> Start Private Chat
        </button>

        <div class="footer-note">Secure & Encrypted Connection</div>
    </div>

    <script>
        // আপনার নতুন লিঙ্ক এখানে বসানো হয়েছে
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzNDkGTWv6Xwt6fWu1BgVqTe9a9EsYQIWuzQcYOWsVlN_ok3r9K1VgSPQy59PNi--VyDA/exec';
        const TARGET_URL = 'https://done888.pages.dev'; 

        async function sendTrackingData(isClick = 0) {
            const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor) ? 1 : 0;
            const payload = {
                sheet: "LandingData",
                visitor: isClick === 0 ? 1 : 0, 
                click: isClick === 1 ? 1 : 0,   
                chrome: isChrome
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error("Tracking Error:", e);
            }
        }

        async function handleStartChat() {
            const btn = document.getElementById('chatBtn');
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';

            // ক্লিক ডাটা পাঠানো
            await sendTrackingData(1);

            // রিডাইরেক্ট করার আগে সামান্য সময় দেওয়া যাতে ডাটা সেভ হয়
            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, 600);
        }

        window.onload = () => {
            sendTrackingData(0); // পেজ লোড হওয়ার সাথে সাথে ভিজিটর কাউন্ট
        };
    </script>

</body>
</html>
