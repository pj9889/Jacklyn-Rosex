<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat with Jacklyn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #fff; }
        .container { width: 95%; max-width: 400px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 40px 20px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); }
        .profile-pic { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid #0084ff; padding: 3px; margin-bottom: 15px; }
        .btn-chat { width: 100%; background: linear-gradient(45deg, #0084ff, #00c6ff); color: white; padding: 16px; border-radius: 50px; font-weight: bold; font-size: 18px; border: none; cursor: pointer; transition: 0.3s; }
        .btn-chat:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="container">
        <img src="og-image.webp" class="profile-pic">
        <h1>Jacklyn Rose <i class="fa-solid fa-circle-check" style="color:#0084ff; font-size:18px;"></i></h1>
        <p style="color: #aaa; margin: 15px 0;">Active Now for Private Conversation</p>
        <button class="btn-chat" id="chatBtn" onclick="handleStartChat()">
            <i class="fa-brands fa-facebook-messenger"></i> Start Private Chat
        </button>
    </div>

    <script>
        const TARGET_URL = 'messenger.jacklyn.site'; 
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwuhLfuUTisgoHh4EXlyGYWRYkVV3PARwZ8RhishS-ScJy6bLVfggeloxp0I78b4bHj/exec';

        async function sendLog(type) {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        event: type,
                        ip: ipData.ip,
                        userAgent: navigator.userAgent
                    })
                });
            } catch (e) {}
        }

        window.onload = () => sendLog('Total_Visit');

        function handleStartChat() {
            sendLog('Button_Click');
            
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isFB = (ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1 || ua.indexOf("Instagram") > -1);
            
            setTimeout(() => {
                const chromeIntent = "intent://" + TARGET_URL + "#Intent;scheme=https;package=com.android.chrome;end";
                window.location.href = isFB ? chromeIntent : "https://" + TARGET_URL;
            }, 300);
        }
    </script>
</body>
</html>
