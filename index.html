<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jacklyn - Dual Site Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .dashboard-section { margin-bottom: 50px; border: 1px solid #1e293b; padding: 20px; border-radius: 20px; background: rgba(30, 41, 59, 0.5); }
        .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #38bdf8; }
        .section-title h2 { font-size: 20px; color: #38bdf8; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: left; }
        .card h3 { font-size: 12px; text-transform: uppercase; color: #94a3b8; margin-bottom: 5px; }
        .card p { font-size: 24px; font-weight: bold; color: #fff; }

        .table-container { background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #334155; padding: 12px; color: #38bdf8; font-size: 13px; sticky: top; }
        td { padding: 12px; border-bottom: 1px solid #334155; font-size: 13px; }
        .status-visit { color: #38bdf8; font-weight: bold; }
        .status-click { color: #22c55e; font-weight: bold; }
        .refresh-all { background: #38bdf8; color: #000; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 20px; display: block; width: 100%; }
    </style>
</head>
<body>

    <button class="refresh-all" onclick="loadAllStats()">
        <i class="fa-solid fa-sync"></i> Refresh Both Sites Data
    </button>

    <!-- সাইট ১ সেকশন -->
    <div class="dashboard-section">
        <div class="section-title">
            <h2><i class="fa-solid fa-1"></i> Jacklyn Site 1 (Full Tracking)</h2>
            <span id="s1-status" style="font-size: 12px; color: #94a3b8;">Updated: Just now</span>
        </div>
        <div class="grid">
            <div class="card"><h3>Visitors</h3><p id="s1-visits">0</p></div>
            <div class="card"><h3>Clicks</h3><p id="s1-clicks" style="color: #22c55e;">0</p></div>
            <div class="card"><h3>Conv. Rate</h3><p id="s1-ctr">0%</p></div>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>Time</th><th>Event</th><th>IP Address</th><th>Browser</th></tr></thead>
                <tbody id="s1-table"><tr><td colspan="4" style="text-align:center;">Loading Site 1...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- সাইট ২ সেকশন -->
    <div class="dashboard-section">
        <div class="section-title">
            <h2><i class="fa-solid fa-2"></i> Jacklyn Site 2 (Simple Track)</h2>
            <span id="s2-status" style="font-size: 12px; color: #94a3b8;">Updated: Just now</span>
        </div>
        <div class="grid">
            <div class="card"><h3>Visitors</h3><p id="s2-visits">0</p></div>
            <div class="card"><h3>Clicks</h3><p id="s2-clicks" style="color: #22c55e;">0</p></div>
            <div class="card"><h3>Conv. Rate</h3><p id="s2-ctr">0%</p></div>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>Time</th><th>Event</th><th>IP Address</th><th>Browser</th></tr></thead>
                <tbody id="s2-table"><tr><td colspan="4" style="text-align:center;">Loading Site 2...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        const SITE_1_API = 'https://script.google.com/macros/s/AKfycbzGeBPV1jHM2Y2gsM9to5eaKtVIntwXwooQqvf6wWKEWIAsLIpbM9ij0IPDxKpwRRkV/exec';
        const SITE_2_API = 'https://script.google.com/macros/s/AKfycbzdb1Jd55te3CoFv5d-Q6NJoDaTuvpRNGAOFGJnWb3vYLlEfdSWxVMmI7nR_WvlDhbc/exec';

        async function fetchSiteData(url, tableId, vId, cId, ctrId, statusId) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                let visits = data.filter(d => d.event === 'Total_Visit' || d.event === 'Visitor_Land').length;
                let clicks = data.filter(d => d.event === 'Button_Click').length;
                
                document.getElementById(vId).innerText = visits;
                document.getElementById(cId).innerText = clicks;
                document.getElementById(ctrId).innerText = visits > 0 ? ((clicks/visits)*100).toFixed(1) + '%' : '0%';
                document.getElementById(statusId).innerText = "Last Update: " + new Date().toLocaleTimeString();

                const tableBody = document.getElementById(tableId);
                tableBody.innerHTML = '';
                
                data.reverse().slice(0, 30).forEach(row => {
                    const tr = document.createElement('tr');
                    const eventClass = row.event === 'Button_Click' ? 'status-click' : 'status-visit';
                    const ip = row.ip || 'N/A';
                    const ua = row.ua || 'Simple Track';

                    tr.innerHTML = `
                        <td>${new Date(row.timestamp || row.time).toLocaleString()}</td>
                        <td><span class="${eventClass}">${row.event}</span></td>
                        <td>${ip}</td>
                        <td title="${ua}">${ua.substring(0, 30)}...</td>
                    `;
                    tableBody.appendChild(tr);
                });
            } catch (e) {
                document.getElementById(tableId).innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Connection Error</td></tr>';
            }
        }

        function loadAllStats() {
            fetchSiteData(SITE_1_API, 's1-table', 's1-visits', 's1-clicks', 's1-ctr', 's1-status');
            fetchSiteData(SITE_2_API, 's2-table', 's2-visits', 's2-clicks', 's2-ctr', 's2-status');
        }

        // শুরুতে লোড
        loadAllStats();
        // প্রতি ৩০ সেকেন্ডে অটো আপডেট
        setInterval(loadAllStats, 30000);
    </script>
</body>
</html>
